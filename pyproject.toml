[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authtime"
version = "0.1.0"
description = "Temporal Authorization Attack & Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
]

[project.scripts]
authtime = "authtime.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
