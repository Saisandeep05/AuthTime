[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authtime"
version = "0.1.0"
description = "Temporal Authorization Attack & Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyjwt>=2.8.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
authtime = "authtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "src"
asyncio_mode = "auto"
