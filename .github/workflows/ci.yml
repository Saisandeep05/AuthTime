name: AuthTime CI & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Automated Suite
        run: |
          pytest --verbose

      - name: Run AuthTime Demonstration Experiment
        run: |
          python run.py

      - name: Verify Report Artifact Generation
        run: |
          test -f reports/sample_report.md
          test -f reports/sample_report.html
          test -f reports/results.json
          echo "All reports successfully generated and validated!"
