name: AuthTime Comprehensive CI & Security Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Automated Suite & Invariants
        run: |
          pytest -v

      - name: Run AuthTime Accelerated Verification Demonstration
        run: |
          python run.py --demo --no-wait


      - name: Verify Report Artifact Generation
        run: |
          test -f reports/examples/sample_report.md
          test -f reports/examples/sample_report.html
          test -f reports/examples/results.json
          echo "All reports successfully generated and validated!"
