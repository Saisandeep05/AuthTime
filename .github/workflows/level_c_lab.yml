name: Level C Infrastructure Validation Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC

jobs:
  level_c_docker_validation:
    name: Level C Docker Compose Lab & Stress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx asyncpg redis

      - name: Start Level C Docker Compose Environment
        run: |
          docker compose -f docker-compose.lab.yml up -d
          docker compose -f docker-compose.lab.yml ps

      - name: Wait for PostgreSQL & Redis Healthchecks
        run: |
          sleep 5
          docker compose -f docker-compose.lab.yml exec -T lab-postgres pg_isready -U authtime -d authtimedb
          docker compose -f docker-compose.lab.yml exec -T lab-redis redis-cli ping

      - name: Run Pytest Suite
        run: |
          python -m pytest -v

      - name: Run Load Test CLI
        run: |
          python scripts/run_load_test.py --concurrency 10 --duration 5

      - name: Run Mitigation Benchmark
        run: |
          python scripts/benchmark_mitigation.py

      - name: Run Endurance Test
        run: |
          python scripts/run_endurance_test.py --duration 10

      - name: Tear Down Level C Environment
        if: always()
        run: |
          docker compose -f docker-compose.lab.yml down -v
